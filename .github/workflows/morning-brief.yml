name: Morning Brief

on:
  schedule:
    - cron: '0 5 * * 1-5'   # 7am Prague when CEST (UTC+2, summer)
    - cron: '0 6 * * 1-5'   # 7am Prague when CET  (UTC+1, winter)
  workflow_dispatch:
    inputs:
      batch_delay_seconds:
        description: 'Seconds to wait between research batches (0 = all concurrent, default). Use this to test working around a per-minute rate limit — does nothing for a zero/exhausted quota.'
        required: false
        default: '0'
      max_concurrency:
        description: 'Max concurrent batch requests when batch_delay_seconds is 0'
        required: false
        default: '5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Generate brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          BATCH_DELAY_SECONDS: ${{ github.event.inputs.batch_delay_seconds || '0' }}
          MAX_CONCURRENCY: ${{ github.event.inputs.max_concurrency || '5' }}
        run: python scripts/generate_brief.py

      - name: Commit updated data
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@github.com"
          git add tickers.json history/ site/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Morning brief $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — remote moved (e.g. a manual push, or the "
            echo "watchlist editor committing to tickers.json), rebasing and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
